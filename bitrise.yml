---
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: kotlin-multiplatform
trigger_map:
- push_branch: "*"
  workflow: run_tests_android
  enabled: false
- pull_request_source_branch: "*"
  workflow: run_tests_android
meta:
  bitrise.io:
    stack: osx-xcode-15.4.x
    machine_type_id: g2-m1.4core
workflows:
  run_tests_android:
    description: Run Android unit tests
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - activate-build-cache-for-gradle@2: {}
    - restore-gradle-cache@2: {}
    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - android-unit-test@1:
        inputs:
        - project_location: "$BITRISE_SOURCE_DIR"
        - module: shared
        - variant: debug
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
        machine_type_id: g2.linux.x-large
    triggers:
      pull_request:
      - target_branch: main
  run_tests_ios:
    description: Run iOS unit tests
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - cache-pull@2: {}
    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - gradle-runner@4:
        inputs:
        - gradle_file: "$BITRISE_SOURCE_DIR/build.gradle.kts"
        - gradle_task: ":shared:iosX64Test"
        - gradlew_path: "$BITRISE_SOURCE_DIR/gradlew"
    - cache-push@2:
        inputs:
        - cache_paths: |
            ~/.gradle
            ~/.konan
            .gradle
            */build
    meta:
      bitrise.io:
        stack: osx-xcode-26.0.x
        machine_type_id: g2.mac.4large
  run_ui_tests_android:
    description: Run Android UI tests
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - restore-gradle-cache@2: {}
    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - android-build-for-ui-testing@0:
        inputs:
        - project_location: "$BITRISE_SOURCE_DIR"
        - module: androidApp
        - variant: debug
    - virtual-device-testing-for-android@1:
        inputs:
        - test_type: instrumentation
        - app_path: "$BITRISE_DEPLOY_DIR/androidApp-debug.apk"
        - test_apk_path: "$BITRISE_DEPLOY_DIR/androidApp-debug-androidTest.apk"
        - test_devices: 'MediumPhone.arm,33,en,portrait

            '
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
        machine_type_id: g2.linux.x-large
  run_ui_tests_ios:
    description: Run iOS UI tests
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - activate-build-cache-for-gradle@2: {}
    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - xcode-build-for-simulator@3:
        inputs:
        - project_path: "$BITRISE_SOURCE_DIR/iosApp/TodoKMP.xcodeproj"
        - scheme: TodoKMP
        - simulator_device: iPhone 16
        - simulator_os_version: latest
        run_if: "false"
    - xcode-test@6:
        inputs:
        - project_path: "$BITRISE_SOURCE_DIR/iosApp/TodoKMP.xcodeproj"
        - scheme: TodoKMP
        - simulator_device: iPhone 16
        - simulator_os_version: latest
        - test_plan: ''
        - only_testing: TodoKMPUITests
    meta:
      bitrise.io:
        stack: osx-xcode-26.0.x
        machine_type_id: g2.mac.4x-large
  temp:
    steps:
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            # write your script here
            curl --netrc-file ~/.netrc https://api.github.com/repos/naveen-bitrise/firefox-ios/releases/latest

            # or run a script from your repository, like:
            # bash ./path/to/script.sh
            # not just bash, e.g.:
            # ruby ./path/to/script.rb
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.2medium
app:
  envs:
  - GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
